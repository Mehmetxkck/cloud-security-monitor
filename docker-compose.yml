services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: cloud-security-monitor:1.0

    container_name: security-monitor-api

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env.docker

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - security-network

  db:
    image: postgres:17

    container_name: security-monitor-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TEST_DB_NAME: ${TEST_DB_NAME}
      BENCHMARK_DB_NAME: ${BENCHMARK_DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      - security-network

volumes:
  postgres_data:

networks:
  security-network:
    driver: bridge
